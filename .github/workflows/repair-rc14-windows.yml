name: Repair RC14 Windows installer
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extract the complete RC13 app and overlay RC14 resources
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          repo="Unclecheng-li/starlit.com"
          old="Starlit-Setup-1.0.0-rc.13-personal-x64.exe"
          overlay="Starlit-RC14-changed-resources.zip"
          gh release download "v1.0.0-rc.13" --repo "$repo" --pattern "$old" --dir . --clobber
          gh release download "v1.0.0-rc.14" --repo "$repo" --pattern "$overlay" --dir . --clobber
          mkdir -p nsis-extracted win-unpacked
          7z x "$old" -onsis-extracted -y
          app_archive=$(find nsis-extracted -type f -iname 'app-64.7z' -print -quit)
          test -n "$app_archive"
          7z x "$app_archive" -owin-unpacked -y
          test -f "win-unpacked/星伴.exe"
          test -f win-unpacked/resources.pak
          test -f win-unpacked/locales/zh-CN.pak
          test -f win-unpacked/resources/app.asar
          test ! -e 'win-unpacked/$PLUGINSDIR'
          unzip -q -o "$overlay" -d win-unpacked
          test -f win-unpacked/resources/backend/StarlitBackend.exe
          test -f win-unpacked/resources/webclient/character-presets.js
      - name: Build repaired RC14 installer
        shell: bash
        run: |
          set -euo pipefail
          cat > package.json <<'JSON'
          {"name":"starlit-desktop","version":"1.0.0-rc.14-personal","private":true}
          JSON
          cat > electron-builder.json <<'JSON'
          {
            "appId": "cn.starlit.companion",
            "productName": "星伴",
            "executableName": "星伴",
            "artifactName": "Starlit-Setup-1.0.0-rc.14-personal-${arch}.${ext}",
            "directories": {"output": "release"},
            "win": {"target": [{"target": "nsis", "arch": ["x64"]}], "icon": "assets/installer-icon.ico"},
            "nsis": {
              "oneClick": true,
              "perMachine": false,
              "allowToChangeInstallationDirectory": false,
              "createDesktopShortcut": true,
              "createStartMenuShortcut": true,
              "shortcutName": "星伴",
              "uninstallDisplayName": "星伴",
              "installerIcon": "assets/installer-icon.ico",
              "uninstallerIcon": "assets/installer-icon.ico",
              "installerHeaderIcon": "assets/installer-icon.ico",
              "deleteAppDataOnUninstall": false
            }
          }
          JSON
          npm install --no-save electron-builder@25.1.8 electron@33.4.11
          npx electron-builder --win nsis --x64 --prepackaged win-unpacked --config electron-builder.json --publish never
      - name: Audit all files embedded in the repaired installer
        shell: bash
        run: |
          set -euo pipefail
          installer="release/Starlit-Setup-1.0.0-rc.14-personal-x64.exe"
          test -f "$installer"
          mkdir -p verify-installer verify-app
          7z x "$installer" -overify-installer -y
          app_archive=$(find verify-installer -type f -iname 'app-64.7z' -print -quit)
          test -n "$app_archive"
          7z x "$app_archive" -overify-app -y
          test -f "verify-app/星伴.exe"
          test -f verify-app/resources.pak
          test -f verify-app/locales/zh-CN.pak
          test -f verify-app/d3dcompiler_47.dll
          test -f verify-app/resources/app.asar
          test -f verify-app/resources/backend/StarlitBackend.exe
          test -f verify-app/resources/webclient/character-presets.js
          test ! -e 'verify-app/$PLUGINSDIR'
          cmp win-unpacked/resources/app.asar verify-app/resources/app.asar
          cmp win-unpacked/resources/backend/StarlitBackend.exe verify-app/resources/backend/StarlitBackend.exe
          echo "完整安装内容审计通过：主程序、Electron 运行文件和 RC14 资源均存在"
      - name: Clean-install, inspect shortcut, and launch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = (Resolve-Path 'release/Starlit-Setup-1.0.0-rc.14-personal-x64.exe').Path
          $installDir = Join-Path $env:RUNNER_TEMP 'starlit-clean-install'
          $dataDir = Join-Path $env:RUNNER_TEMP 'starlit-clean-data'
          Remove-Item -LiteralPath $installDir,$dataDir -Recurse -Force -ErrorAction SilentlyContinue
          $setup = Start-Process -FilePath $installer -ArgumentList @('/S','/currentuser',"/D=$installDir") -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "安装器退出码：$($setup.ExitCode)" }
          $exe = Join-Path $installDir '星伴.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw '干净安装后未找到星伴.exe' }
          foreach ($name in @('resources.pak','d3dcompiler_47.dll','resources/app.asar','resources/backend/StarlitBackend.exe')) {
            if (-not (Test-Path -LiteralPath (Join-Path $installDir $name))) { throw "安装后缺少：$name" }
          }
          $shortcutPath = Join-Path $env:USERPROFILE 'Desktop/星伴.lnk'
          if (-not (Test-Path -LiteralPath $shortcutPath)) { throw '安装后未创建桌面快捷方式' }
          $shortcut = (New-Object -ComObject WScript.Shell).CreateShortcut($shortcutPath)
          if ($shortcut.TargetPath -ne $exe) { throw "快捷方式目标错误：$($shortcut.TargetPath)" }
          Write-Output "快捷方式目标正确：$($shortcut.TargetPath)"
          $env:STARLIT_DATA_ROOT = $dataDir
          $proc = Start-Process -FilePath $exe -ArgumentList @("--user-data-dir=$env:RUNNER_TEMP/starlit-clean-profile") -WorkingDirectory $installDir -PassThru
          try {
            $healthy = $false
            for ($i = 0; $i -lt 180; $i++) {
              if ($proc.HasExited) { throw "主程序提前退出：$($proc.ExitCode)" }
              try {
                $response = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:18765/healthz' -TimeoutSec 3
                if ($response.StatusCode -eq 200) { $healthy = $true; break }
              } catch {}
              Start-Sleep -Seconds 1
            }
            if (-not $healthy) { throw '安装版健康接口启动超时' }
            Write-Output '干净安装、快捷方式和主程序启动验收全部通过'
          } finally {
            if (-not $proc.HasExited) { taskkill /PID $proc.Id /T /F | Out-Null }
          }
      - name: Publish verified replacement
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          repo="Unclecheng-li/starlit.com"
          tag="v1.0.0-rc.14"
          base="Starlit-Setup-1.0.0-rc.14-personal-x64.exe"
          installer="release/$base"
          size=$(stat -c %s "$installer")
          sha=$(sha256sum "$installer" | cut -d ' ' -f 1)
          test "$size" -gt 800000000
          printf '{"version":"1.0.0-rc.14-personal","size":%s,"sha256":"%s","verified":"clean-install-shortcut-launch"}\n' "$size" "$sha" > Starlit-RC14-release.json
          gh release upload "$tag" "$installer" --repo "$repo" --clobber
          gh release upload "$tag" Starlit-RC14-release.json --repo "$repo" --clobber
          for name in $(gh release view "$tag" --repo "$repo" --json assets --jq '.assets[].name'); do
            case "$name" in
              "$base".part*|Starlit-RC14-changed-resources.zip)
                gh release delete-asset "$tag" "$name" --repo "$repo" --yes
                ;;
            esac
          done
          cat Starlit-RC14-release.json
