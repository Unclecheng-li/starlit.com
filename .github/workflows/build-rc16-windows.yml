name: Build and verify RC16 Windows installer
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extract verified RC15 app and overlay RC16 resources
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          repo="Unclecheng-li/starlit.com"
          old="Starlit-Setup-1.0.0-rc.15-personal-x64.exe"
          overlay="Starlit-RC16-changed-resources.zip"
          gh release download "v1.0.0-rc.15" --repo "$repo" --pattern "$old" --dir . --clobber
          gh release download "v1.0.0-rc.16" --repo "$repo" --pattern "$overlay" --dir . --clobber
          mkdir -p nsis-extracted win-unpacked
          7z x "$old" -onsis-extracted -y
          app_archive=$(find nsis-extracted -type f -iname 'app-64.7z' -print -quit)
          test -n "$app_archive"
          7z x "$app_archive" -owin-unpacked -y
          test -f "win-unpacked/Starlit.exe"
          test -f win-unpacked/resources.pak
          test -f win-unpacked/locales/zh-CN.pak
          test -f win-unpacked/resources/app.asar
          test ! -e 'win-unpacked/$PLUGINSDIR'
          unzip -q -o "$overlay" -d win-unpacked
          test -f win-unpacked/resources/backend/StarlitBackend.exe
          test -f win-unpacked/resources/webclient/character-presets.js
          grep -F 'resetTestState: false' win-unpacked/resources/webclient/app.js
          grep -F 'base_url: https://api.deepseek.com' win-unpacked/resources/template/config.yaml
          grep -F 'model: deepseek-flash' win-unpacked/resources/template/config.yaml
      - name: Build RC16 installer
        shell: bash
        run: |
          set -euo pipefail
          cat > package.json <<'JSON'
          {"name":"starlit-desktop","version":"1.0.0-rc.16-personal","private":true}
          JSON
          cat > electron-builder.json <<'JSON'
          {
            "appId": "cn.starlit.companion",
            "productName": "星伴",
            "executableName": "Starlit",
            "artifactName": "Starlit-Setup-1.0.0-rc.16-personal-${arch}.${ext}",
            "directories": {"output": "release"},
            "win": {"target": [{"target": "nsis", "arch": ["x64"]}], "icon": "assets-installer-icon.ico"},
            "nsis": {
              "oneClick": true,
              "perMachine": false,
              "allowToChangeInstallationDirectory": false,
              "createDesktopShortcut": false,
              "createStartMenuShortcut": false,
              "shortcutName": "星伴",
              "include": "assets-installer.nsh",
              "uninstallDisplayName": "星伴",
              "installerIcon": "assets-installer-icon.ico",
              "uninstallerIcon": "assets-installer-icon.ico",
              "installerHeaderIcon": "assets-installer-icon.ico",
              "deleteAppDataOnUninstall": false
            }
          }
          JSON
          npm install --no-save electron-builder@25.1.8 electron@33.4.11
          npx electron-builder --win nsis --x64 --prepackaged win-unpacked --config electron-builder.json --publish never
      - name: Audit every file embedded in RC16 installer
        shell: bash
        run: |
          set -euo pipefail
          installer="release/Starlit-Setup-1.0.0-rc.16-personal-x64.exe"
          test -f "$installer"
          mkdir -p verify-installer verify-app
          7z x "$installer" -overify-installer -y
          app_archive=$(find verify-installer -type f -iname 'app-64.7z' -print -quit)
          test -n "$app_archive"
          7z x "$app_archive" -overify-app -y
          test -f "verify-app/Starlit.exe"
          test -f verify-app/resources.pak
          test -f verify-app/locales/zh-CN.pak
          test -f verify-app/d3dcompiler_47.dll
          test -f verify-app/resources/app.asar
          test -f verify-app/resources/backend/StarlitBackend.exe
          test -f verify-app/resources/webclient/character-presets.js
          test ! -e 'verify-app/$PLUGINSDIR'
          diff -qr win-unpacked verify-app
          file_count=$(find verify-app -type f | wc -l)
          test "$file_count" -ge 2200
          echo "完整安装内容审计通过：$file_count 个文件逐字节一致"
      - name: Clean-install, inspect shortcut, launch and check defaults
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = (Resolve-Path 'release/Starlit-Setup-1.0.0-rc.16-personal-x64.exe').Path
          $installDir = Join-Path $env:RUNNER_TEMP 'starlit-clean-install'
          $dataDir = Join-Path $env:RUNNER_TEMP 'starlit-clean-data'
          Remove-Item -LiteralPath $installDir,$dataDir -Recurse -Force -ErrorAction SilentlyContinue
          $setup = Start-Process -FilePath $installer -ArgumentList @('/S','/currentuser',"/D=$installDir") -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "安装器退出码：$($setup.ExitCode)" }
          $exe = Join-Path $installDir 'Starlit.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw '干净安装后未找到Starlit.exe' }
          foreach ($name in @('resources.pak','d3dcompiler_47.dll','resources/app.asar','resources/backend/StarlitBackend.exe')) {
            if (-not (Test-Path -LiteralPath (Join-Path $installDir $name))) { throw "安装后缺少：$name" }
          }
          Start-Sleep -Seconds 2
          $shortcutPath = Join-Path $env:USERPROFILE 'Desktop/星伴.lnk'
          if (-not (Test-Path -LiteralPath $shortcutPath)) { throw '安装后未创建桌面快捷方式' }
          $shortcutInfo = Get-Item -LiteralPath $shortcutPath
          Write-Output "快捷方式文件：$($shortcutInfo.FullName)，$($shortcutInfo.Length) 字节"
          $env:STARLIT_DATA_ROOT = $dataDir
          Start-Process -FilePath $shortcutPath -WorkingDirectory $installDir
          try {
            $healthy = $false
            for ($i = 0; $i -lt 180; $i++) {
              try {
                $response = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:18765/healthz' -TimeoutSec 3
                if ($response.StatusCode -eq 200) { $healthy = $true; break }
              } catch {}
              Start-Sleep -Seconds 1
            }
            if (-not $healthy) { throw '通过桌面快捷方式启动后，健康接口等待超时' }
            $config = Get-Content -LiteralPath (Join-Path $dataDir 'config.yaml') -Raw
            if (-not $config.Contains('base_url: https://api.deepseek.com')) { throw '安装版默认接口不是 DeepSeek 官方地址' }
            if (-not $config.Contains('model: deepseek-flash')) { throw '安装版默认模型不是 deepseek-flash' }
            Write-Output '干净安装、桌面快捷方式实际启动、健康接口和模型默认值验收全部通过'
          } finally {
            Get-CimInstance Win32_Process | Where-Object { $_.ExecutablePath -eq $exe } | ForEach-Object {
              taskkill /PID $_.ProcessId /T /F 2>$null | Out-Null
            }
          }
          exit 0
      - name: Publish verified RC16 installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          repo="Unclecheng-li/starlit.com"
          tag="v1.0.0-rc.16"
          base="Starlit-Setup-1.0.0-rc.16-personal-x64.exe"
          installer="release/$base"
          size=$(stat -c %s "$installer")
          sha=$(sha256sum "$installer" | cut -d ' ' -f 1)
          test "$size" -gt 800000000
          printf '{"version":"1.0.0-rc.16-personal","size":%s,"sha256":"%s","verified":"full-file-audit-clean-install-shortcut-launch-defaults"}\n' "$size" "$sha" > Starlit-RC16-release.json
          gh release upload "$tag" "$installer" --repo "$repo" --clobber
          gh release upload "$tag" Starlit-RC16-release.json --repo "$repo" --clobber
          gh release delete-asset "$tag" Starlit-RC16-changed-resources.zip --repo "$repo" --yes
          gh release edit "$tag" --repo "$repo" --notes '双端 RC16：修复角色回复把多条分句逐条发送后，又把相同内容合并成一条多行消息重复发送的问题。统一在模型输出解析层删除完全由其他分句组成的汇总气泡，发送与历史记录保持一致；正常重复短句、含新内容的汇总和普通多行消息均保留。\n\n1335 项离线回归、消息发送与历史专项、UI 专项、Android 内容与签名结构审计均已通过。Windows 安装包已完成全文件比对、干净安装、桌面快捷方式实际启动、健康接口及模型默认值验收。Android 真机运行时仍需设备复核。'
          cat Starlit-RC16-release.json
