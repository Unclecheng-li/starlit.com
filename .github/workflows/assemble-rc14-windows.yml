name: Assemble RC14 Windows installer
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extract RC13 and overlay changed RC14 resources
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          repo="Unclecheng-li/starlit.com"
          old="Starlit-Setup-1.0.0-rc.13-personal-x64.exe"
          overlay="Starlit-RC14-changed-resources.zip"
          gh release download "v1.0.0-rc.13" --repo "$repo" --pattern "$old" --dir . --clobber
          gh release download "v1.0.0-rc.14" --repo "$repo" --pattern "$overlay" --dir . --clobber
          mkdir -p win-unpacked
          7z x "$old" -owin-unpacked -y
          unzip -q -o "$overlay" -d win-unpacked
          test -f win-unpacked/resources/backend/StarlitBackend.exe
          test -f win-unpacked/resources/webclient/character-presets.js
          test -f win-unpacked/resources/app.asar
      - name: Build and publish RC14 installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          repo="Unclecheng-li/starlit.com"
          tag="v1.0.0-rc.14"
          base="Starlit-Setup-1.0.0-rc.14-personal-x64.exe"
          cat > package.json <<'JSON'
          {"name":"starlit-desktop","version":"1.0.0-rc.14-personal","private":true}
          JSON
          cat > electron-builder.json <<'JSON'
          {
            "appId": "cn.starlit.companion",
            "productName": "星伴",
            "artifactName": "Starlit-Setup-1.0.0-rc.14-personal-${arch}.${ext}",
            "directories": {"output": "release"},
            "win": {"target": [{"target": "nsis", "arch": ["x64"]}], "icon": "assets/installer-icon.ico"},
            "nsis": {
              "oneClick": true,
              "perMachine": false,
              "allowToChangeInstallationDirectory": false,
              "createDesktopShortcut": true,
              "createStartMenuShortcut": true,
              "shortcutName": "星伴",
              "uninstallDisplayName": "星伴",
              "installerIcon": "assets/installer-icon.ico",
              "uninstallerIcon": "assets/installer-icon.ico",
              "installerHeaderIcon": "assets/installer-icon.ico",
              "deleteAppDataOnUninstall": false
            }
          }
          JSON
          npm install --no-save electron-builder@25.1.8 electron@33.4.11
          npx electron-builder --win nsis --x64 --prepackaged win-unpacked --config electron-builder.json --publish never
          installer="release/$base"
          test -f "$installer"
          size=$(stat -c %s "$installer")
          sha=$(sha256sum "$installer" | cut -d ' ' -f 1)
          test "$size" -gt 800000000
          printf '{"version":"1.0.0-rc.14-personal","size":%s,"sha256":"%s"}\n' "$size" "$sha" > Starlit-RC14-release.json
          gh release upload "$tag" "$installer" --repo "$repo" --clobber
          gh release upload "$tag" Starlit-RC14-release.json --repo "$repo" --clobber
          for name in $(gh release view "$tag" --repo "$repo" --json assets --jq '.assets[].name'); do
            case "$name" in
              "$base".part*|Starlit-RC14-changed-resources.zip)
                gh release delete-asset "$tag" "$name" --repo "$repo" --yes
                ;;
            esac
          done
          cat Starlit-RC14-release.json
