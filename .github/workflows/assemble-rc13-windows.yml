name: Assemble RC13 Windows installer
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Download, verify, publish and clean up
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          repo="Unclecheng-li/starlit.com"
          tag="v1.0.0-rc.13"
          base="Starlit-Setup-1.0.0-rc.13-personal-x64.exe"
          parts=(part0 part1 part2a part2b part3a part3b)
          for part in "${parts[@]}"; do
            gh release download "$tag" --repo "$repo" --pattern "$base.$part" --dir . --clobber
          done
          cat "$base.part0" "$base.part1" "$base.part2a" "$base.part2b" "$base.part3a" "$base.part3b" > "$base"
          test "$(stat -c %s "$base")" = "919497762"
          echo "173abd7256045729777d928f7df8339f39531970246972ca140467273a95ec96  $base" | sha256sum -c -
          gh release upload "$tag" "$base" --repo "$repo" --clobber
          for part in "${parts[@]}"; do
            gh release delete-asset "$tag" "$base.$part" --repo "$repo" --yes
          done
